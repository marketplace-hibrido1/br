<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlivio - Atlas Vivo v0.4</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-900 text-white font-sans">

    <div id="auth-container" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md text-gray-800 text-center">
            <h2 class="text-2xl font-bold mb-6 text-blue-900">Atlivio</h2>
            <button onclick="loginGoogle()" class="w-full mb-4 bg-white text-gray-700 border border-gray-300 font-bold py-3 rounded-lg flex items-center justify-center hover:bg-gray-50 transition">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5 mr-2">
                Entrar com Google
            </button>
            <div class="space-y-4">
                <input type="email" id="email" placeholder="Email" class="w-full p-3 border rounded bg-gray-50 text-black outline-none focus:ring-2 focus:ring-blue-500">
                <input type="password" id="password" placeholder="Senha" class="w-full p-3 border rounded bg-gray-50 text-black outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="handleAuth()" id="btn-auth" class="w-full bg-blue-600 text-white font-bold py-3 rounded hover:bg-blue-700 transition">Acessar</button>
            </div>
        </div>
    </div>

    <div id="role-selection" class="hidden min-h-screen flex items-center justify-center bg-blue-900 p-4">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-lg text-gray-800 text-center">
            <h2 class="text-2xl font-bold mb-4 text-blue-900">Como deseja atuar?</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button onclick="definirPerfil('cliente')" class="p-6 border-2 border-blue-100 rounded-xl hover:border-blue-500 transition text-left">
                    <div class="text-4xl mb-2">🛍️</div>
                    <div class="font-bold text-lg">Cliente</div>
                </button>
                <button onclick="definirPerfil('prestador')" class="p-6 border-2 border-blue-100 rounded-xl hover:border-blue-500 transition text-left">
                    <div class="text-4xl mb-2">🛠️</div>
                    <div class="font-bold text-lg">Prestador</div>
                </button>
            </div>
        </div>
    </div>

    <div id="app-container" class="hidden min-h-screen bg-gray-100 text-gray-800">
        <header class="bg-white shadow-sm p-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-900">Atlivio</h1>
            <button onclick="logout()" class="text-red-500 font-bold text-sm text-black">Sair</button>
        </header>

        <nav class="flex bg-white border-b">
            <button onclick="switchTab('servicos')" id="tab-servicos" class="flex-1 py-3 text-sm font-bold border-b-2 border-blue-600 text-blue-600">Serviços</button>
            <button onclick="switchTab('atlas')" id="tab-atlas" class="flex-1 py-3 text-sm font-bold border-b-2 border-transparent text-gray-500">Atlas Vivo 🌍</button>
        </nav>

        <main class="p-4 max-w-4xl mx-auto">
            <section id="sec-atlas" class="hidden space-y-4">
                <div class="bg-blue-600 p-4 rounded-lg text-white">
                    <h2 class="font-bold">Central de Missões</h2>
                    <p class="text-xs opacity-80">Capture dados reais e ganhe recompensas.</p>
                </div>
                <div id="lista-missoes" class="grid gap-4"></div>
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, query, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDnu2aeI4ainMj3DgApxgQps0mSNFFLavs",
            authDomain: "marketplace-hibrido.firebaseapp.com",
            projectId: "marketplace-hibrido",
            storageBucket: "marketplace-hibrido.firebasestorage.app",
            messagingSenderId: "1768762634630",
            appId: "1:1768762634630:web:447545229712a4f4949216"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let userProfile = null;

        // --- MOTOR DE MISSÕES (Emenda Atlas v1) ---
        window.aceitarMissao = async (missionId) => {
            try {
                const user = auth.currentUser;
                // Criando a 'mission_assignment' conforme Emenda v1
                await addDoc(collection(db, "mission_assignments"), {
                    mission_id: missionId,
                    profile_id: user.uid,
                    status: "accepted", // Status inicial oficial
                    accepted_at: serverTimestamp()
                });
                alert("Missão aceita! Vá ao local e prepare a prova.");
                carregarMissoes();
            } catch (e) { console.error(e); }
        };

        async function carregarMissoes() {
            const snap = await getDocs(collection(db, "missoes"));
            const container = document.getElementById('lista-missoes');
            container.innerHTML = "";
            
            snap.forEach(d => {
                const m = d.data();
                container.innerHTML += `
                    <div class="bg-white p-4 rounded-xl shadow-sm border">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[10px] font-bold text-blue-500 uppercase tracking-widest">ID: ${d.id.substring(0,6)}</span>
                            <span class="font-black text-green-600 text-lg">R$ ${m.recompensa}</span>
                        </div>
                        <h3 class="font-bold text-gray-800">${m.titulo}</h3>
                        <p class="text-xs text-gray-500 mt-1 mb-4">${m.descricao}</p>
                        <button onclick="aceitarMissao('${d.id}')" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold text-sm shadow-md active:scale-95 transition">Aceitar Missão</button>
                    </div>`;
            });
        }

        // --- NUCLEO APP ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                userProfile = await syncProfile(user);
                document.getElementById('auth-container').classList.add('hidden');
                if (!userProfile.perfil_completo) {
                    document.getElementById('role-selection').classList.remove('hidden');
                } else {
                    document.getElementById('app-container').classList.remove('hidden');
                    carregarMissoes();
                }
            } else {
                document.getElementById('auth-container').classList.remove('hidden');
                document.getElementById('app-container').classList.add('hidden');
            }
        });

        async function syncProfile(user) {
            const userRef = doc(db, "usuarios", user.uid);
            const snap = await getDoc(userRef);
            if (!snap.exists()) {
                const n = { email: user.email, is_client: true, is_provider: false, perfil_completo: false, created_at: serverTimestamp() };
                await setDoc(userRef, n); return n;
            }
            return snap.data();
        }

        window.loginGoogle = async () => { try { await signInWithPopup(auth, provider); } catch (e) { console.error(e); } };
        window.logout = () => signOut(auth);
        window.switchTab = (tab) => {
            document.getElementById('sec-atlas').classList.toggle('hidden', tab !== 'atlas');
            // atualizar estilos de abas omitido por brevidade
        };
    </script>
</body>
</html>
