<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlivio - Atlas Proof v0.8</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-900 text-white font-sans">

    <div id="auth-container" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md text-gray-800 text-center">
            <h2 class="text-2xl font-black text-blue-900 italic uppercase">Atlivio</h2>
            <button onclick="loginGoogle()" class="w-full mb-4 bg-white text-gray-700 border border-gray-300 font-bold py-3 rounded-lg flex items-center justify-center hover:bg-gray-50 transition">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5 mr-2">
                Entrar com Google
            </button>
        </div>
    </div>

    <div id="modal-proof" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
        <div class="bg-white text-gray-800 p-6 rounded-2xl max-w-sm w-full shadow-2xl">
            <h3 class="font-black text-lg text-blue-900 uppercase mb-2">Enviar Prova</h3>
            <p class="text-[10px] text-gray-600 mb-6">Capture a foto do serviço/missão para auditoria e pagamento.</p>
            
            <div class="space-y-4">
                <input type="file" id="input-camera" accept="image/*" capture="environment" class="hidden">
                <button onclick="document.getElementById('input-camera').click()" class="w-full border-2 border-dashed border-blue-200 py-8 rounded-xl flex flex-col items-center justify-center hover:bg-blue-50 transition">
                    <span class="text-3xl">📸</span>
                    <span class="text-[10px] font-bold text-blue-600 mt-2">ABRIR CÂMERA</span>
                </button>
                <div id="preview-container" class="hidden">
                    <img id="img-preview" class="w-full h-32 object-cover rounded-lg border">
                </div>
                <button id="btn-submit-proof" onclick="enviarProva()" class="hidden w-full bg-green-600 text-white py-3 rounded-xl font-bold text-sm shadow-lg active:scale-95 transition">FINALIZAR E ENVIAR</button>
                <button onclick="fecharModalProof()" class="w-full text-gray-400 font-bold text-xs">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="app-container" class="hidden min-h-screen bg-gray-100 text-gray-800 flex flex-col">
        <header class="bg-white shadow-sm p-4 flex justify-between items-center z-10">
            <h1 class="text-xl font-black text-blue-900 italic uppercase">Atlivio</h1>
            <button onclick="logout()" class="text-red-500 font-bold text-sm">Sair</button>
        </header>

        <nav class="flex bg-white border-b z-10 overflow-x-auto">
            <button onclick="switchTab('atlas')" id="tab-atlas" class="flex-1 py-3 px-4 text-xs font-black border-b-2 border-blue-600 text-blue-600 uppercase italic">Atlas Vivo 🌍</button>
            <button onclick="switchTab('ganhar')" id="tab-ganhar" class="flex-1 py-3 px-4 text-xs font-black border-b-2 border-transparent text-gray-500 uppercase italic">Ganhar 💸</button>
            <button onclick="switchTab('chat')" id="tab-chat" class="flex-1 py-3 px-4 text-xs font-black border-b-2 border-transparent text-gray-500 uppercase italic">Chat 💬</button>
        </nav>

        <main class="flex-1 overflow-y-auto p-4 max-w-4xl mx-auto w-full">
            <section id="sec-atlas" class="space-y-4">
                <div id="lista-missoes" class="grid gap-4"></div>
            </section>
            </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc, getDocs, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDnu2aeI4ainMj3DgApxgQps0mSNFFLavs",
            authDomain: "marketplace-hibrido.firebaseapp.com",
            projectId: "marketplace-hibrido",
            storageBucket: "marketplace-hibrido.firebasestorage.app",
            messagingSenderId: "1768762634630",
            appId: "1:1768762634630:web:447545229712a4f4949216"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const provider = new GoogleAuthProvider();

        let activeAssignmentId = null;
        let selectedFile = null;

        // --- MOTOR DE PROVAS (Atlas Vivo v1.0) ---
        window.prepararProva = (assignmentId) => {
            activeAssignmentId = assignmentId;
            document.getElementById('modal-proof').classList.remove('hidden');
        };

        document.getElementById('input-camera').addEventListener('change', (e) => {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                const reader = new FileReader();
                reader.onload = (re) => {
                    document.getElementById('img-preview').src = re.target.result;
                    document.getElementById('preview-container').classList.remove('hidden');
                    document.getElementById('btn-submit-proof').classList.remove('hidden');
                };
                reader.readAsDataURL(selectedFile);
            }
        });

        window.enviarProva = async () => {
            if(!selectedFile || !activeAssignmentId) return;
            const btn = document.getElementById('btn-submit-proof');
            btn.disabled = true;
            btn.innerText = "ENVIANDO...";

            try {
                // 1. Upload para o Storage
                const storageRef = ref(storage, `provas/${activeAssignmentId}/${Date.now()}.jpg`);
                await uploadBytes(storageRef, selectedFile);
                const photoUrl = await getDownloadURL(storageRef);

                // 2. Registro na mission_photos
                await addDoc(collection(db, "mission_photos"), {
                    assignment_id: activeAssignmentId,
                    photo_url: photoUrl,
                    uploaded_at: serverTimestamp()
                });

                // 3. Atualizar status para SUBMITTED
                const assignRef = doc(db, "mission_assignments", activeAssignmentId);
                await updateDoc(assignRef, {
                    status: "submitted",
                    submitted_at: serverTimestamp()
                });

                alert("Prova enviada com sucesso! Aguarde aprovação.");
                fecharModalProof();
                location.reload();
            } catch (e) { alert("Erro no envio: " + e.message); }
        };

        window.fecharModalProof = () => {
            document.getElementById('modal-proof').classList.add('hidden');
            selectedFile = null;
        };

        // ... RESTANTE DO CÓDIGO (SYNC, AUTH, TABS) MANTIDO ...
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                carregarItemsAtlas();
            }
        });

        async function carregarItemsAtlas() {
            // Carrega missões e assignments ativos para mostrar botão de "Enviar Prova"
            const q = query(collection(db, "missoes"));
            const snap = await getDocs(q);
            const container = document.getElementById('lista-missoes');
            container.innerHTML = "";
            snap.forEach(d => {
                const m = d.data();
                container.innerHTML += `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                        <h3 class="font-bold text-gray-800 text-sm">${m.titulo}</h3>
                        <p class="text-[10px] text-gray-500 mb-4">${m.descricao}</p>
                        <button onclick="prepararProva('${d.id}')" class="w-full bg-blue-600 text-white py-3 rounded-lg font-black text-xs uppercase shadow-md active:scale-95 transition">Enviar Prova 📸</button>
                    </div>`;
            });
        }
    </script>
</body>
</html>
