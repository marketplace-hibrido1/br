<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace Híbrido - Atlas Vivo v0.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-900 text-white font-sans">

    <div id="auth-container" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md text-gray-800 text-center">
            <h2 class="text-2xl font-bold mb-6 text-blue-900">Marketplace Híbrido</h2>
            <button onclick="loginGoogle()" class="w-full mb-4 bg-white text-gray-700 border border-gray-300 font-bold py-3 rounded-lg flex items-center justify-center hover:bg-gray-50 transition">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5 mr-2">
                Entrar com Google
            </button>
            <div class="relative my-6"><div class="absolute inset-0 flex items-center"><span class="w-full border-t"></span></div><div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-2 text-gray-500">Acesso via E-mail</span></div></div>
            <div class="space-y-4">
                <input type="email" id="email" placeholder="Email" class="w-full p-3 border rounded bg-gray-50 text-black outline-none focus:ring-2 focus:ring-blue-500">
                <input type="password" id="password" placeholder="Senha" class="w-full p-3 border rounded bg-gray-50 text-black outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="handleAuth()" id="btn-auth" class="w-full bg-blue-600 text-white font-bold py-3 rounded hover:bg-blue-700 transition">Acessar</button>
            </div>
            <button onclick="toggleMode()" id="btn-toggle" class="mt-6 text-blue-600 text-sm font-bold hover:underline">Ainda não tem conta? Cadastre-se</button>
        </div>
    </div>

    <div id="role-selection" class="hidden min-h-screen flex items-center justify-center bg-blue-900 p-4">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-lg text-gray-800 text-center">
            <h2 class="text-2xl font-bold mb-4 text-blue-900">Como deseja atuar?</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button onclick="definirPerfil('cliente')" class="p-6 border-2 border-blue-100 rounded-xl hover:border-blue-500 transition group text-left">
                    <div class="text-4xl mb-2">🛍️</div>
                    <div class="font-bold text-lg group-hover:text-blue-600">Cliente</div>
                    <div class="text-xs text-gray-500">Contratar serviços e missões.</div>
                </button>
                <button onclick="definirPerfil('prestador')" class="p-6 border-2 border-blue-100 rounded-xl hover:border-blue-500 transition group text-left">
                    <div class="text-4xl mb-2">🛠️</div>
                    <div class="font-bold text-lg group-hover:text-blue-600">Prestador</div>
                    <div class="text-xs text-gray-500">Ganhar com serviços e Atlas Vivo.</div>
                </button>
            </div>
        </div>
    </div>

    <div id="app-container" class="hidden min-h-screen bg-gray-100 text-gray-800">
        <header class="bg-white shadow-sm p-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-blue-900 leading-tight">Marketplace Híbrido</h1>
                <p id="user-role-label" class="text-[10px] font-black text-blue-600 uppercase"></p>
            </div>
            <button onclick="logout()" class="text-red-500 font-bold text-sm">Sair</button>
        </header>

        <nav class="flex bg-white border-b overflow-x-auto">
            <button onclick="switchTab('servicos')" id="tab-servicos" class="flex-1 py-3 text-sm font-bold border-b-2 border-blue-600 text-blue-600">Serviços</button>
            <button onclick="switchTab('atlas')" id="tab-atlas" class="flex-1 py-3 text-sm font-bold border-b-2 border-transparent text-gray-500">Atlas Vivo 🌍</button>
        </nav>

        <main class="p-4">
            <section id="sec-servicos" class="space-y-4">
                <h2 class="text-lg font-bold">Catálogo Geral</h2>
                <div id="lista-servicos" class="grid gap-4"></div>
            </section>

            <section id="sec-atlas" class="hidden space-y-4">
                <div class="bg-blue-50 p-4 rounded-lg border border-blue-100">
                    <h2 class="font-bold text-blue-900">Missões Disponíveis</h2>
                    <p class="text-xs text-blue-700">Ganhe PIX rápido cumprindo tarefas locais.</p>
                </div>
                <div id="lista-missoes" class="grid gap-4"></div>
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDnu2aeI4ainMj3DgApxgQps0mSNFFLavs",
            authDomain: "marketplace-hibrido.firebaseapp.com",
            projectId: "marketplace-hibrido",
            storageBucket: "marketplace-hibrido.firebasestorage.app",
            messagingSenderId: "1768762634630",
            appId: "1:1768762634630:web:447545229712a4f4949216"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUserData = null;

        // --- AUTH & SYNC ---
        async function syncProfile(user) {
            const userRef = doc(db, "usuarios", user.uid);
            const userSnap = await getDoc(userRef);
            if (!userSnap.exists()) {
                const novo = { email: user.email, is_client: true, is_provider: false, perfil_completo: false, created_at: new Date() };
                await setDoc(userRef, novo); return novo;
            }
            return userSnap.data();
        }

        window.loginGoogle = async () => { try { await signInWithPopup(auth, provider); } catch (e) { console.error(e); } };
        window.handleAuth = async () => { /* implementação simplificada por brevidade */ };
        window.logout = () => signOut(auth);

        window.definirPerfil = async (tipo) => {
            const user = auth.currentUser;
            const userRef = doc(db, "usuarios", user.uid);
            const dados = tipo === 'prestador' ? { is_provider: true, is_client: false, perfil_completo: true } : { is_provider: false, is_client: true, perfil_completo: true };
            await updateDoc(userRef, dados); location.reload();
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserData = await syncProfile(user);
                document.getElementById('auth-container').classList.add('hidden');
                if (!currentUserData.perfil_completo) {
                    document.getElementById('role-selection').classList.remove('hidden');
                } else {
                    document.getElementById('app-container').classList.remove('hidden');
                    document.getElementById('user-role-label').innerText = currentUserData.is_provider ? "Prestador de Elite" : "Cliente Marketplace";
                    initAppData();
                }
            } else {
                document.getElementById('auth-container').classList.remove('hidden');
                document.getElementById('app-container').classList.add('hidden');
            }
        });

        // --- NAVEGAÇÃO & DADOS ---
        window.switchTab = (tab) => {
            document.getElementById('sec-servicos').classList.toggle('hidden', tab !== 'servicos');
            document.getElementById('sec-atlas').classList.toggle('hidden', tab !== 'atlas');
            document.getElementById('tab-servicos').className = tab === 'servicos' ? "flex-1 py-3 text-sm font-bold border-b-2 border-blue-600 text-blue-600" : "flex-1 py-3 text-sm font-bold border-b-2 border-transparent text-gray-500";
            document.getElementById('tab-atlas').className = tab === 'atlas' ? "flex-1 py-3 text-sm font-bold border-b-2 border-blue-600 text-blue-600" : "flex-1 py-3 text-sm font-bold border-b-2 border-transparent text-gray-500";
        };

        async function initAppData() {
            carregarItems('servicos', 'lista-servicos');
            carregarItems('missoes', 'lista-missoes');
        }

        async function carregarItems(colecao, containerId) {
            const q = query(collection(db, colecao));
            const snap = await getDocs(q);
            const container = document.getElementById(containerId);
            container.innerHTML = snap.empty ? `<p class="text-gray-400 text-sm">Nada encontrado aqui ainda.</p>` : "";
            snap.forEach(doc => {
                const item = doc.data();
                container.innerHTML += `
                    <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-gray-800">${item.nome || item.titulo}</h3>
                            <span class="bg-green-100 text-green-700 text-[10px] px-2 py-1 rounded-full font-black text-xs">R$ ${item.preco || item.recompensa}</span>
                        </div>
                        <p class="text-xs text-gray-500 mt-1">${item.descricao}</p>
                        <button class="mt-3 w-full bg-blue-50 text-blue-600 py-2 rounded text-xs font-bold hover:bg-blue-600 hover:text-white transition">Ver Detalhes</button>
                    </div>`;
            });
        }
    </script>
</body>
</html>
