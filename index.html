<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlivio - Afiliados & Ofertas v0.7</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-900 text-white font-sans">

    <div id="auth-container" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md text-gray-800 text-center">
            <h2 class="text-2xl font-black text-blue-900 italic uppercase">Atlivio</h2>
            <button onclick="loginGoogle()" class="w-full mb-4 bg-white text-gray-700 border border-gray-300 font-bold py-3 rounded-lg flex items-center justify-center hover:bg-gray-50 transition">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5 mr-2">
                Entrar com Google
            </button>
        </div>
    </div>

    <div id="modal-legal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
        <div class="bg-white text-gray-800 p-6 rounded-2xl max-w-sm w-full shadow-2xl">
            <h3 class="font-black text-lg text-blue-900 uppercase mb-2">Regulamento de Ofertas</h3>
            <p class="text-[10px] leading-relaxed text-gray-600 mb-4">
                Podemos receber comissão quando você usa links desta página. As ofertas são de responsabilidade exclusiva dos parceiros. Não garantimos aprovação ou prazos.
            </p>
            <button onclick="aceitarRegulamento()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold text-sm shadow-lg active:scale-95 transition">Li e concordo</button>
        </div>
    </div>

    <div id="app-container" class="hidden min-h-screen bg-gray-100 text-gray-800 flex flex-col">
        <header class="bg-white shadow-sm p-4 flex justify-between items-center z-10">
            <h1 class="text-xl font-black text-blue-900 italic uppercase italic">Atlivio</h1>
            <button onclick="logout()" class="text-red-500 font-bold text-sm">Sair</button>
        </header>

        <nav class="flex bg-white border-b z-10 overflow-x-auto">
            <button onclick="switchTab('atlas')" id="tab-atlas" class="flex-1 py-3 px-4 text-xs font-black border-b-2 border-blue-600 text-blue-600 whitespace-nowrap uppercase italic">Atlas Vivo 🌍</button>
            <button onclick="switchTab('ganhar')" id="tab-ganhar" class="flex-1 py-3 px-4 text-xs font-black border-b-2 border-transparent text-gray-500 whitespace-nowrap uppercase italic">Ganhar 💸</button>
            <button onclick="switchTab('chat')" id="tab-chat" class="flex-1 py-3 px-4 text-xs font-black border-b-2 border-transparent text-gray-500 whitespace-nowrap uppercase italic">Chat 💬</button>
        </nav>

        <main class="flex-1 overflow-y-auto p-4 max-w-4xl mx-auto w-full">
            <section id="sec-ganhar" class="hidden space-y-4">
                <div class="bg-gradient-to-br from-green-600 to-green-700 p-4 rounded-2xl text-white shadow-lg">
                    <h2 class="font-black italic uppercase">Renda Extra & Ofertas</h2>
                    <p class="text-[10px] opacity-90">Links selecionados para aumentar seus ganhos mensais.</p>
                </div>
                <div id="lista-ofertas" class="grid gap-4"></div>
            </section>

            <section id="sec-atlas" class="space-y-4">
                <div id="lista-missoes" class="grid gap-4"></div>
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc, getDocs, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDnu2aeI4ainMj3DgApxgQps0mSNFFLavs",
            authDomain: "marketplace-hibrido.firebaseapp.com",
            projectId: "marketplace-hibrido",
            storageBucket: "marketplace-hibrido.firebasestorage.app",
            messagingSenderId: "1768762634630",
            appId: "1:1768762634630:web:447545229712a4f4949216"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let userProfile = null;

        // --- MÓDULO AFILIADOS (v1.0) ---
        window.abrirOferta = async (ofertaId, slug, url) => {
            if(!userProfile.legal_accepted) {
                document.getElementById('modal-legal').classList.remove('hidden');
                return;
            }
            
            // Grava clique rastreado
            await addDoc(collection(db, "affiliate_clicks"), {
                link_id: slug,
                user_id: auth.currentUser.uid,
                clicked_at: serverTimestamp()
            });
            
            window.open(url, '_blank');
        };

        window.aceitarRegulamento = async () => {
            const userRef = doc(db, "usuarios", auth.currentUser.uid);
            await updateDoc(userRef, { 
                legal_accepted: true, 
                legal_accepted_at: serverTimestamp() 
            });
            document.getElementById('modal-legal').classList.add('hidden');
            location.reload();
        };

        async function carregarOfertas() {
            const snap = await getDocs(collection(db, "affiliate_offers"));
            const container = document.getElementById('lista-ofertas');
            container.innerHTML = "";
            snap.forEach(d => {
                const o = d.data();
                container.innerHTML += `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                        <div class="flex justify-between items-start mb-2">
                            <span class="bg-gray-100 text-gray-500 text-[9px] px-2 py-1 rounded font-black uppercase tracking-tighter">Parceiro: ${o.partner}</span>
                            <span class="text-green-600 font-black text-xs uppercase italic">Oferta Ativa</span>
                        </div>
                        <h3 class="font-bold text-gray-800 text-sm mb-1">${o.name}</h3>
                        <p class="text-[10px] text-gray-500 mb-4">${o.category} • Verificado Atlivio</p>
                        <button onclick="abrirOferta('${d.id}', '${o.slug}', '${o.landing_url}')" class="w-full bg-gray-800 text-white py-3 rounded-lg font-black text-xs uppercase shadow-md active:scale-95 transition">Abrir Oferta Externo ↗</button>
                        <p class="text-[8px] text-center mt-2 text-gray-400 italic">Ao abrir, você concorda com os termos do parceiro.</p>
                    </div>`;
            });
        }

        // --- AUTH & NAVIGATION ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const snap = await getDoc(doc(db, "usuarios", user.uid));
                userProfile = snap.data();
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                carregarOfertas();
                // Funções anteriores de carregamento (Atlas) mantidas aqui
            }
        });

        window.switchTab = (tab) => {
            ['atlas', 'ganhar', 'chat'].forEach(t => {
                document.getElementById(`sec-${t}`).classList.toggle('hidden', t !== tab);
                const btn = document.getElementById(`tab-${t}`);
                btn.className = t === tab 
                    ? "flex-1 py-3 px-4 text-xs font-black border-b-2 border-blue-600 text-blue-600 whitespace-nowrap uppercase italic"
                    : "flex-1 py-3 px-4 text-xs font-black border-b-2 border-transparent text-gray-500 whitespace-nowrap uppercase italic";
            });
        };

        window.loginGoogle = () => signInWithPopup(auth, provider);
        window.logout = () => signOut(auth);
    </script>
</body>
</html>
