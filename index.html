<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlivio - Monetização Blindada v0.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-900 text-white font-sans">

    <div id="auth-container" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md text-gray-800 text-center">
            <h2 class="text-2xl font-bold mb-6 text-blue-900">Atlivio</h2>
            <button onclick="loginGoogle()" class="w-full mb-4 bg-white text-gray-700 border border-gray-300 font-bold py-3 rounded-lg flex items-center justify-center hover:bg-gray-50 transition">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5 mr-2">
                Entrar com Google
            </button>
            <div class="space-y-4">
                <input type="email" id="email" placeholder="Email" class="w-full p-3 border rounded bg-gray-50 text-black outline-none focus:ring-2 focus:ring-blue-500">
                <input type="password" id="password" placeholder="Senha" class="w-full p-3 border rounded bg-gray-50 text-black outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="handleAuth()" id="btn-auth" class="w-full bg-blue-600 text-white font-bold py-3 rounded hover:bg-blue-700 transition">Acessar</button>
            </div>
        </div>
    </div>

    <div id="role-selection" class="hidden min-h-screen flex items-center justify-center bg-blue-900 p-4">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-lg text-gray-800 text-center">
            <h2 class="text-2xl font-bold mb-4 text-blue-900">Escolha sua atuação</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button onclick="definirPerfil('cliente')" class="p-6 border-2 border-blue-100 rounded-xl hover:border-blue-500 transition text-left text-black">
                    <div class="text-4xl mb-2">🛍️</div>
                    <div class="font-bold text-lg">Cliente</div>
                </button>
                <button onclick="definirPerfil('prestador')" class="p-6 border-2 border-blue-100 rounded-xl hover:border-blue-500 transition text-left text-black">
                    <div class="text-4xl mb-2">🛠️</div>
                    <div class="font-bold text-lg">Prestador</div>
                </button>
            </div>
        </div>
    </div>

    <div id="app-container" class="hidden min-h-screen bg-gray-100 text-gray-800">
        <header class="bg-white shadow-sm p-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-900">Atlivio</h1>
            <div class="flex items-center gap-3">
                <span id="badge-pro" class="hidden bg-yellow-400 text-yellow-900 text-[10px] px-2 py-1 rounded-full font-black">PRO</span>
                <button onclick="logout()" class="text-red-500 font-bold text-sm">Sair</button>
            </div>
        </header>

        <nav class="flex bg-white border-b">
            <button onclick="switchTab('servicos')" id="tab-servicos" class="flex-1 py-3 text-sm font-bold border-b-2 border-blue-600 text-blue-600">Serviços</button>
            <button onclick="switchTab('atlas')" id="tab-atlas" class="flex-1 py-3 text-sm font-bold border-b-2 border-transparent text-gray-500 text-black">Atlas Vivo 🌍</button>
        </nav>

        <main class="p-4 max-w-4xl mx-auto">
            <section id="sec-atlas" class="hidden space-y-4">
                <div id="pro-banner" class="hidden bg-gradient-to-r from-yellow-400 to-yellow-600 p-4 rounded-lg text-white shadow-lg">
                    <h2 class="font-bold">Upgrade para PRO 🚀</h2>
                    <p class="text-[10px]">Veja missões 5 minutos antes de todos e ganhe mais.</p>
                </div>
                <div id="lista-missoes" class="grid gap-4"></div>
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDnu2aeI4ainMj3DgApxgQps0mSNFFLavs",
            authDomain: "marketplace-hibrido.firebaseapp.com",
            projectId: "marketplace-hibrido",
            storageBucket: "marketplace-hibrido.firebasestorage.app",
            messagingSenderId: "1768762634630",
            appId: "1:1768762634630:web:447545229712a4f4949216"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let userProfile = null;

        // --- MONITOR DE ESTADO COM BLINDAGEM ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                userProfile = await syncProfile(user);
                document.getElementById('auth-container').classList.add('hidden');
                
                if (!userProfile.perfil_completo) {
                    document.getElementById('role-selection').classList.remove('hidden');
                } else {
                    document.getElementById('role-selection').classList.add('hidden');
                    document.getElementById('app-container').classList.remove('hidden');
                    
                    // Lógica de UI baseada em Monetização
                    if(userProfile.is_pro) {
                        document.getElementById('badge-pro').classList.remove('hidden');
                    } else {
                        document.getElementById('pro-banner').classList.remove('hidden');
                    }
                    
                    carregarMissoesBlindadas();
                }
            } else {
                document.getElementById('auth-container').classList.remove('hidden');
                document.getElementById('app-container').classList.add('hidden');
            }
        });

        // --- CARREGAMENTO COM DELAY (Regra de Monetização 2) ---
        async function carregarMissoesBlindadas() {
            const container = document.getElementById('lista-missoes');
            container.innerHTML = "<p class='text-xs italic'>Sincronizando feed prioritário...</p>";

            const snap = await getDocs(collection(db, "missoes"));
            container.innerHTML = "";
            
            const agora = new Date();
            const delayMinutos = 5;

            snap.forEach(d => {
                const m = d.data();
                const dataCriacao = m.created_at?.toDate() || agora;
                const diferencaMinutos = (agora - dataCriacao) / (1000 * 60);

                // Se não for PRO e a missão tiver menos de 5 min, ela fica oculta ou com trava
                const disponivel = userProfile.is_pro || diferencaMinutos >= delayMinutos;

                if (disponivel) {
                    container.innerHTML += `
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-[10px] font-bold text-blue-500 uppercase">RECOMPENSA</span>
                                <span class="font-black text-green-600 text-lg">R$ ${m.recompensa}</span>
                            </div>
                            <h3 class="font-bold text-gray-800">${m.titulo}</h3>
                            <button class="mt-4 w-full bg-blue-600 text-white py-3 rounded-lg font-bold text-sm">Aceitar Missão</button>
                        </div>`;
                } else {
                    container.innerHTML += `
                        <div class="bg-gray-100 p-4 rounded-xl border border-dashed border-gray-300 opacity-60">
                            <p class="text-[10px] font-bold text-gray-400">🔒 BLOQUEADO POR PRIORIDADE PRO</p>
                            <h3 class="font-bold text-gray-400">Missão Exclusiva</h3>
                            <p class="text-[10px] text-gray-400">Disponível para Free em breve...</p>
                        </div>`;
                }
            });
        }

        async function syncProfile(user) {
            const userRef = doc(db, "usuarios", user.uid);
            const snap = await getDoc(userRef);
            if (!snap.exists()) {
                const n = { email: user.email, is_client: true, is_provider: false, is_pro: false, perfil_completo: false, created_at: serverTimestamp() };
                await setDoc(userRef, n); return n;
            }
            return snap.data();
        }

        window.loginGoogle = async () => { try { await signInWithPopup(auth, provider); } catch (e) { console.error(e); } };
        window.logout = () => signOut(auth);
        window.switchTab = (tab) => {
            document.getElementById('sec-atlas').classList.toggle('hidden', tab !== 'atlas');
        };
        window.definirPerfil = async (tipo) => {
            const user = auth.currentUser;
            const userRef = doc(db, "usuarios", user.uid);
            const dados = tipo === 'prestador' ? { is_provider: true, is_client: false, perfil_completo: true } : { is_provider: false, is_client: true, perfil_completo: true };
            await updateDoc(userRef, dados); location.reload();
        };
    </script>
</body>
</html>
