<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace Híbrido - v0002a</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-900 text-white font-sans">

    <div id="auth-container" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md text-gray-800 text-center">
            <h2 class="text-2xl font-bold mb-6 text-blue-900">Marketplace Híbrido</h2>
            
            <button onclick="loginGoogle()" class="w-full mb-4 bg-white text-gray-700 border border-gray-300 font-bold py-3 rounded-lg flex items-center justify-center hover:bg-gray-50 transition">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5 mr-2">
                Entrar com Google
            </button>

            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center"><span class="w-full border-t"></span></div>
                <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-2 text-gray-500">Ou use e-mail</span></div>
            </div>

            <div class="space-y-4">
                <input type="email" id="email" placeholder="Email" class="w-full p-3 border rounded bg-gray-50 text-black outline-none focus:ring-2 focus:ring-blue-500">
                <input type="password" id="password" placeholder="Senha" class="w-full p-3 border rounded bg-gray-50 text-black outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="handleAuth()" id="btn-auth" class="w-full bg-blue-600 text-white font-bold py-3 rounded hover:bg-blue-700 transition">Acessar</button>
            </div>
            
            <button onclick="toggleMode()" id="btn-toggle" class="mt-6 text-blue-600 text-sm font-bold hover:underline">Ainda não tem conta? Cadastre-se</button>
        </div>
    </div>

    <div id="app-container" class="hidden min-h-screen bg-gray-100 text-gray-800 p-6">
        <header class="flex justify-between items-center mb-8 border-b pb-4">
            <div>
                <h1 class="text-2xl font-bold text-blue-900">Marketplace Híbrido</h1>
                <p id="user-role" class="text-xs font-bold text-blue-600 uppercase tracking-widest"></p>
            </div>
            <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded font-bold hover:bg-red-600 transition">Sair</button>
        </header>

        <main id="conteudo-principal">
            <div id="servicos-lista" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <p class="text-gray-500 italic">Carregando dados do Firestore...</p>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Configuração extraída da sua imagem
        const firebaseConfig = {
            apiKey: "AIzaSyDnu2aeI4ainMj3DgApxgQps0mSNFFLavs",
            authDomain: "marketplace-hibrido.firebaseapp.com",
            projectId: "marketplace-hibrido",
            storageBucket: "marketplace-hibrido.firebasestorage.app",
            messagingSenderId: "1768762634630",
            appId: "1:1768762634630:web:447545229712a4f4949216"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let isRegistering = false;

        // --- LÓGICA DE PERFIL (EMENDA 0002a) ---
        async function syncProfile(user) {
            const userRef = doc(db, "usuarios", user.uid);
            const userSnap = await getDoc(userRef);

            if (!userSnap.exists()) {
                // Criar perfil padrão conforme validação da Emenda 11
                const novoPerfil = {
                    email: user.email,
                    is_client: true,
                    is_provider: false,
                    created_at: new Date(),
                    updated_at: new Date()
                };
                await setDoc(userRef, novoPerfil);
                return novoPerfil;
            } else {
                // Atualização idempotente
                await updateDoc(userRef, { updated_at: new Date() });
                return userSnap.data();
            }
        }

        // --- AUTENTICAÇÃO ---
        window.toggleMode = () => {
            isRegistering = !isRegistering;
            document.getElementById('auth-title')?.innerText = isRegistering ? "Criar Conta" : "Entrar";
            document.getElementById('btn-auth').innerText = isRegistering ? "Cadastrar" : "Acessar";
        };

        window.loginGoogle = async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (e) { alert("Erro Google: " + e.message); }
        };

        window.handleAuth = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                if (isRegistering) await createUserWithEmailAndPassword(auth, email, password);
                else await signInWithEmailAndPassword(auth, email, password);
            } catch (e) { alert("Erro: " + e.code); }
        };

        window.logout = () => signOut(auth);

        // --- MONITOR DE ESTADO ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const perfil = await syncProfile(user); // Garante o profile antes de mostrar a tela
                
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                document.getElementById('user-role').innerText = perfil.is_provider ? "Modo: Prestador" : "Modo: Cliente";
                
                carregarServicos();
            } else {
                document.getElementById('auth-container').classList.remove('hidden');
                document.getElementById('app-container').classList.add('hidden');
            }
        });

        // --- CARREGAR DADOS ---
        async function carregarServicos() {
            const querySnapshot = await getDocs(collection(db, "servicos"));
            const lista = document.getElementById('servicos-lista');
            lista.innerHTML = querySnapshot.empty ? "<p>Nenhum serviço disponível.</p>" : "";
            
            querySnapshot.forEach((doc) => {
                const s = doc.data();
                lista.innerHTML += `
                    <div class="bg-white p-4 rounded shadow border-l-4 border-blue-600">
                        <h3 class="font-bold">${s.nome}</h3>
                        <p class="text-blue-600 font-bold text-sm">R$ ${s.preco}</p>
                    </div>`;
            });
        }
    </script>
</body>
</html>
