<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlivio v1.1 - Sistema Integrado</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-900 text-white font-sans">

    <div id="auth-container" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md text-gray-800 text-center">
            <h2 class="text-3xl font-black text-blue-900 italic uppercase mb-6 tracking-tighter">Atlivio</h2>
            <button onclick="loginGoogle()" class="w-full mb-4 bg-white text-gray-700 border border-gray-300 font-bold py-4 rounded-xl flex items-center justify-center hover:bg-gray-50 transition shadow-sm">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5 mr-3">
                Entrar com Google
            </button>
            <p class="text-[10px] text-gray-400 uppercase font-bold tracking-widest">Segurança Google Identity ativa</p>
        </div>
    </div>

    <div id="role-selection" class="hidden min-h-screen flex items-center justify-center bg-blue-900 p-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-lg text-gray-800 text-center">
            <h2 class="text-2xl font-black text-blue-900 uppercase mb-6 italic italic">Como deseja atuar?</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-left">
                <button onclick="definirPerfil('cliente')" class="p-6 border-2 border-blue-50 rounded-2xl hover:border-blue-600 transition group">
                    <div class="text-4xl mb-2">🛍️</div>
                    <div class="font-black text-blue-900 uppercase italic group-hover:text-blue-600">Cliente</div>
                    <div class="text-[10px] text-gray-500">Contratar serviços e realizar missões.</div>
                </button>
                <button onclick="definirPerfil('prestador')" class="p-6 border-2 border-blue-50 rounded-2xl hover:border-blue-600 transition group">
                    <div class="text-4xl mb-2">🛠️</div>
                    <div class="font-black text-blue-900 uppercase italic group-hover:text-blue-600">Prestador</div>
                    <div class="text-[10px] text-gray-500">Oferecer serviços e ganhar PIX.</div>
                </button>
            </div>
        </div>
    </div>

    <div id="app-container" class="hidden min-h-screen bg-gray-100 text-gray-800 flex flex-col">
        <header class="bg-white shadow-sm p-4 flex justify-between items-center z-20">
            <div>
                <h1 class="text-xl font-black text-blue-900 italic uppercase">Atlivio</h1>
                <p id="tenant-label" class="text-[8px] font-bold text-gray-400 uppercase italic"></p>
            </div>
            <button onclick="logout()" class="text-red-500 font-black text-xs uppercase italic">Sair</button>
        </header>

        <nav class="flex bg-white border-b z-20 overflow-x-auto no-scrollbar">
            <button onclick="switchTab('atlas')" id="tab-atlas" class="flex-1 py-3 px-4 text-[10px] font-black border-b-2 border-blue-600 text-blue-600 uppercase italic">Atlas 🌍</button>
            <button onclick="switchTab('ganhar')" id="tab-ganhar" class="flex-1 py-3 px-4 text-[10px] font-black border-b-2 border-transparent text-gray-400 uppercase italic">Ganhar 💸</button>
            <button onclick="switchTab('chat')" id="tab-chat" class="flex-1 py-3 px-4 text-[10px] font-black border-b-2 border-transparent text-gray-500 uppercase italic">Chat 💬</button>
            <button onclick="switchTab('admin')" id="tab-admin" class="hidden flex-1 py-3 px-4 text-[10px] font-black border-b-2 border-transparent text-red-600 uppercase italic">Gestão 🛡️</button>
        </nav>

        <main class="flex-1 overflow-y-auto p-4 max-w-4xl mx-auto w-full">
            <section id="sec-atlas" class="space-y-4">
                <div id="lista-missoes" class="grid gap-4"></div>
            </section>
            <section id="sec-ganhar" class="hidden space-y-4">
                <div id="lista-ofertas" class="grid gap-4"></div>
            </section>
            <section id="sec-chat" class="hidden">
                <div class="bg-yellow-50 border-2 border-dashed border-yellow-200 p-8 rounded-2xl text-center">
                    <h2 class="font-black text-yellow-800 uppercase italic">Acesso Restrito</h2>
                    <p class="text-[10px] text-yellow-700 mt-2">O chat requer Escrow autorizado por segurança.</p>
                </div>
            </section>
            <section id="sec-admin" class="hidden space-y-6 text-black">
                <div class="bg-red-600 p-4 rounded-xl text-white shadow-lg">
                    <h2 class="font-black uppercase italic text-sm">Painel do Fundador</h2>
                    <p class="text-[9px] opacity-80">Auditoria inteligente e Gestão de Receita.</p>
                </div>
                <div id="admin-lista-auditoria" class="grid gap-4"></div>
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc, getDocs, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CONFIGURAÇÃO ATUALIZADA POR VOCÊ
        const firebaseConfig = {
            apiKey: "AIzaSyDnu2aeI4ainMj3DgApxgQpsOmSNFfLavs",
            authDomain: "marketplace-hibrido.firebaseapp.com",
            projectId: "marketplace-hibrido",
            storageBucket: "marketplace-hibrido.firebasestorage.app",
            messagingSenderId: "411968595024",
            appId: "1:411968595024:web:ce0488c9c4aec0dcda9d55",
            measurementId: "G-TWQRB0VKM4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let userProfile = null;
        const DEFAULT_TENANT = "atlivio_fsa_01"; 

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const snap = await getDoc(doc(db, "usuarios", user.uid));
                if(!snap.exists()) {
                    userProfile = { email: user.email, tenant_id: DEFAULT_TENANT, perfil_completo: false, role: 'user', created_at: serverTimestamp() };
                    await setDoc(doc(db, "usuarios", user.uid), userProfile);
                } else {
                    userProfile = snap.data();
                }

                document.getElementById('auth-container').classList.add('hidden');
                if(!userProfile.perfil_completo) {
                    document.getElementById('role-selection').classList.remove('hidden');
                } else {
                    document.getElementById('role-selection').classList.add('hidden');
                    document.getElementById('app-container').classList.remove('hidden');
                    document.getElementById('tenant-label').innerText = `Rede: ${userProfile.tenant_id}`;
                    if(userProfile.role === 'admin') {
                        document.getElementById('tab-admin').classList.remove('hidden');
                    }
                    carregarMissoes();
                }
            } else {
                document.getElementById('auth-container').classList.remove('hidden');
                document.getElementById('app-container').classList.add('hidden');
            }
        });

        window.loginGoogle = () => signInWithPopup(auth, provider).catch(e => alert("Erro: " + e.message));
        window.logout = () => signOut(auth);
        window.definirPerfil = async (tipo) => {
            await updateDoc(doc(db, "usuarios", auth.currentUser.uid), { is_provider: tipo === 'prestador', perfil_completo: true });
            location.reload();
        };

        window.switchTab = (tab) => {
            ['atlas', 'ganhar', 'chat', 'admin'].forEach(t => {
                const sec = document.getElementById(`sec-${t}`);
                if(sec) sec.classList.toggle('hidden', t !== tab);
                const btn = document.getElementById(`tab-${t}`);
                if(btn) btn.className = t === tab ? "flex-1 py-3 px-4 text-[10px] font-black border-b-2 border-blue-600 text-blue-600 uppercase italic" : "flex-1 py-3 px-4 text-[10px] font-black border-b-2 border-transparent text-gray-400 uppercase italic";
            });
        };

        async function carregarMissoes() {
            const snap = await getDocs(collection(db, "missoes"));
            const container = document.getElementById('lista-missoes');
            container.innerHTML = "";
            snap.forEach(d => {
                const m = d.data();
                container.innerHTML += `
                    <div class="bg-white p-5 rounded-2xl border-l-8 border-blue-600 shadow-sm">
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="font-black text-gray-800 text-sm uppercase italic">${m.titulo}</h3>
                            <span class="text-green-600 font-black text-sm italic italic">R$ ${m.recompensa}</span>
                        </div>
                        <p class="text-[10px] text-gray-500 mb-4 leading-relaxed">${m.descricao}</p>
                        <button class="w-full bg-blue-900 text-white py-3 rounded-xl font-black text-[10px] uppercase italic active:scale-95 transition shadow-lg">Ver Detalhes 📸</button>
                    </div>`;
            });
        }
    </script>
</body>
</html>
