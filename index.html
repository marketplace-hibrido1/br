<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlivio v2.1 - Atlas Vivo Beta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Loader de Upload */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-blue-900 text-white font-sans selection:bg-blue-500 selection:text-white">

    <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden" onchange="processarFoto(this)">

    <div id="auth-container" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md text-gray-800 text-center border-b-4 border-blue-900">
            <h2 class="text-4xl font-black text-blue-900 italic uppercase mb-2 tracking-tighter">Atlivio</h2>
            <p class="text-gray-400 text-xs font-bold uppercase tracking-widest mb-8">Sistema Integrado Híbrido</p>
            
            <button onclick="loginGoogle()" class="w-full mb-4 bg-white text-gray-700 border-2 border-gray-100 font-bold py-4 rounded-xl flex items-center justify-center hover:bg-gray-50 hover:border-blue-200 transition shadow-sm group">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-6 h-6 mr-3 group-hover:scale-110 transition">
                Entrar com Google
            </button>
            <p class="text-[9px] text-gray-300 uppercase font-bold tracking-widest mt-4">Protegido por Google Identity</p>
            <p id="error-msg" class="text-red-500 text-xs mt-4 hidden"></p>
        </div>
    </div>

    <div id="role-selection" class="hidden min-h-screen flex items-center justify-center bg-blue-900 p-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-lg text-gray-800 text-center">
            <h2 class="text-2xl font-black text-blue-900 uppercase mb-2 italic">Identidade</h2>
            <p class="text-gray-400 text-xs font-bold uppercase mb-8">Como você deseja atuar hoje?</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-left">
                <button onclick="definirPerfil('cliente')" class="p-6 border-2 border-gray-50 rounded-2xl hover:border-blue-600 hover:bg-blue-50 transition group">
                    <div class="text-4xl mb-3">🛍️</div>
                    <div class="font-black text-blue-900 uppercase italic">Cliente</div>
                </button>
                <button onclick="definirPerfil('prestador')" class="p-6 border-2 border-gray-50 rounded-2xl hover:border-blue-600 hover:bg-blue-50 transition group">
                    <div class="text-4xl mb-3">🛠️</div>
                    <div class="font-black text-blue-900 uppercase italic">Prestador</div>
                </button>
            </div>
        </div>
    </div>

    <div id="upload-overlay" class="hidden fixed inset-0 bg-blue-900 bg-opacity-90 z-50 flex flex-col items-center justify-center text-white">
        <div class="loader mb-4"></div>
        <h3 class="font-black uppercase italic text-xl animate-pulse">Enviando Prova...</h3>
        <p class="text-xs text-blue-200 mt-2">Não feche o navegador.</p>
    </div>

    <div id="app-container" class="hidden min-h-screen bg-gray-50 text-gray-800 flex flex-col">
        <header class="bg-white shadow-sm p-4 flex justify-between items-center z-30 sticky top-0">
            <div>
                <h1 class="text-xl font-black text-blue-900 italic uppercase tracking-tight">Atlivio</h1>
                <p id="tenant-label" class="text-[8px] font-bold text-gray-400 uppercase italic">Carregando...</p>
            </div>
            <button onclick="logout()" class="text-red-400 font-black text-[10px] uppercase italic border border-red-100 px-3 py-1 rounded-lg">Sair</button>
        </header>

        <nav class="flex bg-white border-b border-gray-100 z-20 overflow-x-auto no-scrollbar shadow-sm">
            <button onclick="switchTab('atlas')" id="tab-atlas" class="flex-1 py-4 px-4 text-[10px] font-black border-b-2 border-blue-600 text-blue-600 uppercase italic">Atlas 🌍</button>
            <button onclick="switchTab('ganhar')" id="tab-ganhar" class="flex-1 py-4 px-4 text-[10px] font-black border-b-2 border-transparent text-gray-400 uppercase italic">Ganhar 💸</button>
            <button onclick="switchTab('chat')" id="tab-chat" class="flex-1 py-4 px-4 text-[10px] font-black border-b-2 border-transparent text-gray-400 uppercase italic">Chat 💬</button>
            <button onclick="switchTab('admin')" id="tab-admin" class="hidden flex-1 py-4 px-4 text-[10px] font-black border-b-2 border-transparent text-red-400 uppercase italic">Gestão 🛡️</button>
        </nav>

        <main class="flex-1 overflow-y-auto p-4 max-w-2xl mx-auto w-full pb-24">
            <section id="sec-atlas" class="space-y-4 animate-fadeIn">
                <div id="loading-missoes" class="hidden text-center py-8">
                    <p class="text-[10px] text-gray-400 font-bold uppercase">Buscando missões...</p>
                </div>
                <div id="lista-missoes" class="grid gap-4"></div>
            </section>
            
            <section id="sec-ganhar" class="hidden space-y-4 animate-fadeIn text-center py-10 opacity-50">
                <p class="text-4xl mb-2">💸</p><p class="text-xs font-bold text-gray-400 uppercase">Sem ofertas</p>
            </section>
            
            <section id="sec-chat" class="hidden animate-fadeIn text-center py-10 opacity-50">
                <p class="text-4xl mb-2">💬</p><p class="text-xs font-bold text-gray-400 uppercase">Chat Indisponível</p>
            </section>

            <section id="sec-admin" class="hidden space-y-6 text-black animate-fadeIn">
                <div class="bg-red-600 p-6 rounded-2xl text-white shadow-lg"><h2 class="font-black uppercase italic text-sm">Painel do Fundador</h2></div>
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc, getDocs, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        // IMPORTANDO STORAGE (NOVO)
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDnu2aeI4ainMj3DgApxgQpsOmSNFfLavs",
            authDomain: "marketplace-hibrido.firebaseapp.com",
            projectId: "marketplace-hibrido",
            storageBucket: "marketplace-hibrido.firebasestorage.app",
            messagingSenderId: "411968595024",
            appId: "1:411968595024:web:ce0488c9c4aec0dcda9d55",
            measurementId: "G-TWQRB0VKM4"
        };

        let app, auth, db, storage, provider;

        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            storage = getStorage(app); // INICIALIZANDO STORAGE
            provider = new GoogleAuthProvider();
            console.log("🔥 Firebase + Storage Online");
        } catch (e) {
            console.error(e);
            document.getElementById('error-msg').innerText = "Erro: " + e.message;
            document.getElementById('error-msg').classList.remove('hidden');
        }

        let userProfile = null;
        const DEFAULT_TENANT = "atlivio_fsa_01"; 
        let missaoAtualId = null; 

        // AUTENTICAÇÃO
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const snap = await getDoc(doc(db, "usuarios", user.uid));
                if(!snap.exists()) {
                    userProfile = { email: user.email, tenant_id: DEFAULT_TENANT, perfil_completo: false, role: 'user', created_at: serverTimestamp() };
                    await setDoc(doc(db, "usuarios", user.uid), userProfile);
                } else {
                    userProfile = snap.data();
                }
                document.getElementById('auth-container').classList.add('hidden');
                if(!userProfile.perfil_completo) document.getElementById('role-selection').classList.remove('hidden');
                else iniciarApp();
            } else {
                document.getElementById('auth-container').classList.remove('hidden');
                document.getElementById('role-selection').classList.add('hidden');
                document.getElementById('app-container').classList.add('hidden');
            }
        });

        function iniciarApp() {
            document.getElementById('role-selection').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('tenant-label').innerText = `Rede: ${userProfile.tenant_id}`;
            if(userProfile.role === 'admin') document.getElementById('tab-admin').classList.remove('hidden');
            carregarMissoes();
        }

        window.loginGoogle = () => signInWithPopup(auth, provider);
        window.logout = () => signOut(auth).then(() => location.reload());
        window.definirPerfil = async (tipo) => {
            await updateDoc(doc(db, "usuarios", auth.currentUser.uid), { is_provider: tipo === 'prestador', perfil_completo: true });
            location.reload();
        };

        window.switchTab = (tab) => {
            ['atlas', 'ganhar', 'chat', 'admin'].forEach(t => {
                document.getElementById(`sec-${t}`).classList.toggle('hidden', t !== tab);
                const btn = document.getElementById(`tab-${t}`);
                if(btn) btn.className = t === tab ? "flex-1 py-4 px-4 text-[10px] font-black border-b-2 border-blue-600 text-blue-600 uppercase italic" : "flex-1 py-4 px-4 text-[10px] font-black border-b-2 border-transparent text-gray-400 uppercase italic";
            });
        };

        // --- SISTEMA ATLAS VIVO (UPLOAD REAL) ---
        async function carregarMissoes() {
            const container = document.getElementById('lista-missoes');
            container.innerHTML = "";
            
            try {
                const q = query(collection(db, "missoes"), where("tenant_id", "==", userProfile.tenant_id));
                const snap = await getDocs(q);
                
                if(snap.empty) {
                    container.innerHTML = `<div class="text-center py-12 text-gray-400"><p>Sem missões.</p></div>`;
                } else {
                    snap.forEach(d => {
                        const m = d.data();
                        container.innerHTML += `
                            <div class="bg-white p-5 rounded-2xl border-l-4 border-blue-900 shadow-sm mb-4">
                                <div class="flex justify-between items-start mb-3">
                                    <h3 class="font-black text-blue-900 text-sm uppercase italic">${m.titulo}</h3>
                                    <span class="bg-green-100 text-green-700 px-2 py-1 rounded-md font-black text-[10px]">R$ ${m.recompensa}</span>
                                </div>
                                <p class="text-[10px] text-gray-500 mb-4 line-clamp-2">${m.descricao}</p>
                                <button onclick="iniciarMissao('${d.id}')" class="w-full bg-blue-600 text-white py-3 rounded-xl font-black text-[10px] uppercase italic active:scale-95 transition flex items-center justify-center gap-2">
                                    📸 Capturar Prova
                                </button>
                            </div>`;
                    });
                }
            } catch (error) {
                console.error(error);
                container.innerHTML = `<p class="text-red-500 text-center text-xs">Erro ao carregar (Veja Console)</p>`;
            }
        }

        window.iniciarMissao = (id) => {
            missaoAtualId = id;
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    () => document.getElementById('camera-input').click(),
                    () => alert("Erro: GPS Obrigatório.")
                );
            } else {
                alert("Sem suporte a GPS.");
            }
        };

        // --- FUNÇÃO DE UPLOAD ATUALIZADA ---
        window.processarFoto = async (input) => {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const loader = document.getElementById('upload-overlay');
                
                // 1. Mostra Loader
                loader.classList.remove('hidden');

                try {
                    // 2. Cria Referência no Storage (Pasta: provas/ID_USUARIO/TIMESTAMP.jpg)
                    const timestamp = new Date().getTime();
                    const caminhoArquivo = `provas/${auth.currentUser.uid}/${timestamp}_${file.name}`;
                    const storageRef = ref(storage, caminhoArquivo);

                    // 3. Faz o Upload
                    console.log("Iniciando upload para:", caminhoArquivo);
                    const snapshot = await uploadBytes(storageRef, file);
                    
                    // 4. Pega o Link Público
                    const downloadURL = await getDownloadURL(snapshot.ref);
                    console.log("Upload concluído. Link:", downloadURL);

                    // 5. Salva Registro no Banco (Atlas Vivo Doc)
                    await addDoc(collection(db, "mission_assignments"), {
                        mission_id: missaoAtualId,
                        profile_id: auth.currentUser.uid,
                        photo_url: downloadURL,
                        status: "submitted",
                        submitted_at: serverTimestamp(),
                        tenant_id: userProfile.tenant_id
                    });

                    // 6. Sucesso
                    loader.classList.add('hidden');
                    alert("✅ PROVA ENVIADA PARA A NUVEM!\n\nSua missão foi registrada e está em análise.");
                    input.value = ''; // Limpa input

                } catch (error) {
                    console.error("Erro no upload:", error);
                    loader.classList.add('hidden');
                    alert("❌ Falha no envio: " + error.message + "\n\n(DICA: Verifique se você ATIVOU o Storage no painel do Firebase)");
                }
            }
        };
    </script>
</body>
</html>
