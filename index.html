<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlivio Enterprise - v0.9</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-900 text-white font-sans">

    <div id="auth-container" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md text-gray-800 text-center">
            <h2 class="text-2xl font-black text-blue-900 italic uppercase">Atlivio Enterprise</h2>
            <button onclick="loginGoogle()" class="w-full mb-4 bg-white text-gray-700 border border-gray-300 font-bold py-3 rounded-lg flex items-center justify-center hover:bg-gray-50 transition">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5 mr-2 text-black">
                Entrar com Google
            </button>
        </div>
    </div>

    <div id="app-container" class="hidden min-h-screen bg-gray-100 text-gray-800 flex flex-col">
        <header class="bg-white shadow-sm p-4 flex justify-between items-center z-10">
            <div>
                <h1 class="text-xl font-black text-blue-900 italic uppercase">Atlivio</h1>
                <p id="tenant-label" class="text-[8px] font-bold text-gray-400 uppercase tracking-widest">Tenant: Loading...</p>
            </div>
            <button onclick="logout()" class="text-red-500 font-bold text-sm text-black">Sair</button>
        </header>

        <nav class="flex bg-white border-b z-10 overflow-x-auto">
            <button onclick="switchTab('atlas')" id="tab-atlas" class="flex-1 py-3 px-4 text-xs font-black border-b-2 border-blue-600 text-blue-600 uppercase italic">Atlas Vivo 🌍</button>
            <button onclick="switchTab('chat')" id="tab-chat" class="flex-1 py-3 px-4 text-xs font-black border-b-2 border-transparent text-gray-500 uppercase italic">Chat de Orçamentos 💬</button>
        </nav>

        <main class="flex-1 overflow-y-auto p-4 max-w-4xl mx-auto w-full">
            <section id="sec-chat" class="hidden space-y-4">
                <div id="escrow-lock" class="bg-yellow-50 border-2 border-dashed border-yellow-200 p-8 rounded-2xl text-center">
                    <span class="text-4xl">🔐</span>
                    <h2 class="font-black text-yellow-800 uppercase mt-4">Chat Bloqueado</h2>
                    <p class="text-[10px] text-yellow-700 mt-2 leading-relaxed">
                        Conforme política de segurança, o chat só é habilitado após a autorização do Escrow (reserva de pagamento).<br>
                        <b>Sem Escrow → Sem Chat.</b>
                    </p>
                    <button class="mt-6 bg-yellow-600 text-white px-6 py-2 rounded-full font-bold text-xs uppercase shadow-md">Ver Pedidos Pendentes</button>
                </div>

                <div id="chat-active-container" class="hidden">
                    </div>
            </section>

            <section id="sec-atlas" class="space-y-4">
                <div id="lista-missoes" class="grid gap-4"></div>
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDnu2aeI4ainMj3DgApxgQps0mSNFFLavs",
            authDomain: "marketplace-hibrido.firebaseapp.com",
            projectId: "marketplace-hibrido",
            storageBucket: "marketplace-hibrido.firebasestorage.app",
            messagingSenderId: "1768762634630",
            appId: "1:1768762634630:web:447545229712a4f4949216"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let userProfile = null;
        const DEFAULT_TENANT = "platform_main"; // Multi-tenant v1

        // --- GOVERNANÇA DE SEGURANÇA (Emenda DB-First) ---
        async function checkEscrowStatus(orderId) {
            // Regra: Nenhuma transação válida fora de orders
            if(!orderId) return false;
            const orderRef = doc(db, "orders", orderId);
            const snap = await getDoc(orderRef);
            return snap.exists() && snap.data().status === "escrow_authorized";
        }

        // --- NUCLEO APP ENTERPRISE ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                userProfile = await syncProfile(user);
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                document.getElementById('tenant-label').innerText = `Tenant: ${DEFAULT_TENANT}`;

                // Regra de Chat pós-escrow
                const chatHabilitado = await checkEscrowStatus(userProfile.active_order_id);
                if(chatHabilitado) {
                    document.getElementById('escrow-lock').classList.add('hidden');
                    document.getElementById('chat-active-container').classList.remove('hidden');
                }

                carregarDadosAtlas();
            } else {
                document.getElementById('auth-container').classList.remove('hidden');
                document.getElementById('app-container').classList.add('hidden');
            }
        });

        async function syncProfile(user) {
            const userRef = doc(db, "usuarios", user.uid);
            const snap = await getDoc(userRef);
            if (!snap.exists()) {
                const n = { 
                    email: user.email, 
                    tenant_id: DEFAULT_TENANT, // Multi-tenant desde v1
                    perfil_completo: false, 
                    created_at: serverTimestamp() 
                };
                await setDoc(userRef, n); return n;
            }
            return snap.data();
        }

        window.loginGoogle = () => signInWithPopup(auth, provider);
        window.logout = () => signOut(auth);
        window.switchTab = (tab) => {
            document.getElementById('sec-atlas').classList.toggle('hidden', tab !== 'atlas');
            document.getElementById('sec-chat').classList.toggle('hidden', tab !== 'chat');
        };

        // Carregamento de dados com filtro Multi-tenant
        async function carregarDadosAtlas() {
            const q = query(collection(db, "missoes"), where("tenant_id", "==", DEFAULT_TENANT));
            const snap = await getDocs(q);
            // Renderização das missões mantida...
        }
    </script>
</body>
</html>
